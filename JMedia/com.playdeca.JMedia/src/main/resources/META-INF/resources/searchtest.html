<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search focus test</title>
<link rel="stylesheet" href="/css/cinema-home.css?v=4">
<style>
  body { background:#111; color:#eee; font-family:system-ui,sans-serif; padding:24px 16px 140px; }
  h1 { font-size:18px; margin:0 0 8px; }
  p  { color:#aaa; font-size:13px; line-height:1.5; margin:0 0 24px; }
  .bare { width:100%; height:50px; border-radius:9999px; border:1px solid #444;
          background:#1c1c1c; color:#fff; padding:0 16px; font-size:16px; }
  .case { margin-bottom:32px; }
  /* same as the app: pinned to the bottom. On iOS the keyboard resizes the visual
     viewport, which moves fixed elements - the remaining suspect. */
  #testDock { position: fixed; left:0; right:0; bottom:0; }
  body { padding-bottom: 160px; }
</style>
</head>
<body>
<h1>Search focus test</h1>
<p>Tap each field once, type a few letters. This page loads the real cinema CSS but none of
cinema-mode.js, so whatever happens here is CSS-only.</p>

<div class="case">
  <div style="margin-bottom:8px">1. Bare input (no dock classes)</div>
  <input class="bare" id="bareInput" type="text" placeholder="Bare input…" autocomplete="off">
</div>

<div class="case">
  <div style="margin-bottom:8px">2. Dock search (real markup + real CSS)</div>
  <div style="color:#888;font-size:12px">The dock below is fixed to the bottom, same as the app.</div>
</div>

<div class="cinema-dock searching" id="testDock">
  <div class="cinema-search-bar">
    <input class="cinema-search-input" id="searchInput" type="text" placeholder="Dock search input..." autocomplete="off">
  </div>
  <div class="cinema-search-dropdown" id="searchDropdown"></div>
</div>

<script>
(function () {
  'use strict';
  var dock = document.getElementById('testDock');
  var btn  = document.getElementById('testSearchBtn');
  var input = document.getElementById('searchInput');
  var bare = document.getElementById('bareInput');

  function report(which, event, el) {
    try {
      var a = document.activeElement;
      var active = a ? (a.id || a.tagName || 'unknown') : 'null';
      var inDom = el ? document.body.contains(el) : false;
      var vis = el ? (el.offsetParent !== null && getComputedStyle(el).display !== 'none') : false;
      var dockClass = dock ? (dock.className || '').replace(/\s+/g, '.') : 'none';
      var img = new Image();
      img.src = '/__searchdiag/test-' + which + '/' + event + '/' + encodeURIComponent(active)
              + '/dom=' + inDom + '/vis=' + vis + '/dock=' + encodeURIComponent(dockClass.slice(0, 40))
              + '/' + Date.now();
    } catch (e) { /* diagnostics only */ }
  }

  function hook(which, el) {
    if (!el) return;
    ['focus', 'blur', 'focusout'].forEach(function (ev) {
      el.addEventListener(ev, function () { report(which, ev, el); });
    });
  }
  hook('bare', bare);
  hook('dock', input);

  // Keep the dock in 'searching' state so the field is visible; no swap to test.
})();
</script>
</body>
</html>
