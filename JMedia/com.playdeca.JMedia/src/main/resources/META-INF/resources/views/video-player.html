<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMedia Player</title>
    <link rel="stylesheet" href="/css/player.css"/>
    <link rel="stylesheet" href="/css/subtitle-styling.css"/>
    <link rel="stylesheet" href="/lib/primeicons.css"/>
    <link rel="stylesheet" href="/lib/font-awesome/all.min.css"/>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .player-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        .player-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .back-btn {
            background: none;
            border: none;
            color: #48c774;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .back-btn:hover { background: rgba(72,199,116,0.15); }
        .media-info {
            flex: 1;
            min-width: 0;
        }
        .media-title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-meta {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
        }
        .no-video-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #aaa;
            font-size: 18px;
        }
        .no-video-msg h2 { color: #48c774; margin-bottom: 8px; }
        .loading-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #aaa;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="player-page">
        <div class="player-header">
            <button class="back-btn" onclick="window.history.back()" title="Back">←</button>
            <div class="media-info">
                <div class="media-title" id="mediaTitle">Loading...</div>
                <div class="media-meta" id="mediaMeta"></div>
            </div>
        </div>
        <div class="player-body">
            <div class="player-container paused" id="customPlayer" style="display:none;">
                <div class="video-wrapper">
                    <video id="videoElement" crossorigin="anonymous" playsinline autoplay></video>
                    <canvas id="assCanvas" class="ass-canvas"></canvas>
                </div>
            </div>
            <div class="loading-msg" id="loadingMsg">Loading video...</div>
            <div class="no-video-msg" id="noVideoMsg" style="display:none;">
                <h2>No video specified</h2>
                <p>Add ?videoId=XXX to the URL</p>
            </div>
            <div class="no-video-msg" id="errorMsg" style="display:none;">
                <h2>Failed to load video</h2>
                <p id="errorDetail"></p>
            </div>
        </div>
    </div>

    <script src="/js/player/ConversionGate.js"></script>
    <script src="/js/player/Utils.js?v=3"></script>
    <script src="/js/player/StateManager.js"></script>
    <script src="/js/player/StreamManager.js?v=21"></script>
    <script src="/js/player/UIBuilder.js?v=5"></script>
    <script src="/js/player/ControlsManager.js"></script>
    <script src="/js/player/FullscreenManager.js"></script>
    <script src="/js/player/SubtitleController.js?v=2"></script>
    <script src="/js/player/AudioTrackSelector.js"></script>
    <script src="/js/player/SubtitleSettingsUI.js"></script>
    <script src="/js/player/StoryboardManager.js"></script>
    <script src="/js/player/EventBinder.js?v=5"></script>
    <script src="/js/player/KeyboardShortcuts.js"></script>
    <script src="/js/player/SkipController.js"></script>
    <script src="/js/player/ProgressReporter.js"></script>
    <script src="/js/player/NavigationManager.js?v=2"></script>
    <script src="/js/hls-loader.js?v=2"></script>
    <script src="/js/simple-player.js?v=9"></script>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const videoId = params.get('videoId');

            if (!videoId) {
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('noVideoMsg').style.display = 'block';
                return;
            }

            const container = document.getElementById('customPlayer');
            const videoEl = document.getElementById('videoElement');
            const titleEl = document.getElementById('mediaTitle');
            const metaEl = document.getElementById('mediaMeta');
            const loadingMsg = document.getElementById('loadingMsg');
            const errorMsg = document.getElementById('errorMsg');
            const errorDetail = document.getElementById('errorDetail');

            // Fetch video metadata and populate container data attributes
            fetch(`/api/video/${videoId}`, { credentials: 'include' })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(data => {
                    const v = data.data || data;
                    if (!v || !v.id) throw new Error('Video not found');

                    // Populate data attributes that SimplePlayer reads
                    container.dataset.videoId = v.id;
                    container.dataset.title = v.title || v.seriesTitle || '';
                    container.dataset.path = v.path ? v.path.replace(/\\/g, '/') : '';
                    container.dataset.duration = v.duration || 0;
                    container.dataset.type = v.type || 'movie';
                    container.dataset.seriesTitle = v.seriesTitle || '';
                    container.dataset.seasonNumber = v.seasonNumber || 1;
                    container.dataset.episodeNumber = v.episodeNumber || 0;
                    container.dataset.seriesImdbId = v.showImdbId || 'Not found';
                    container.dataset.meta = (v.type === 'Episode' || v.type === 'episode')
                        ? `S${v.seasonNumber}E${v.episodeNumber} • ${v.episodeTitle || 'Untitled'}`
                        : (v.releaseYear || '');
                    container.dataset.startTime = v.resumeTime || 0;
                    container.dataset.nextId = '';
                    container.dataset.prevId = '';
                    // Heuristic: non-MP4 containers need transcoding
                    const ext = (v.path || '').toLowerCase().split('.').pop();
                    const needsTranscode = !['mp4', 'm4v', 'webm'].includes(ext);
                    container.dataset.needsTranscode = needsTranscode;
                    container.dataset.needsConversion = 'false';
                    container.dataset.hlsEnabled = 'false';
                    container.dataset.conversionJobId = '';
                    container.dataset.conversionStatus = '';
                    container.dataset.videoCodec = '';
                    container.dataset.audioCodec = v.audioCodec || '';
                    container.dataset.hasMultipleAudio = v.hasMultipleAudioTrack || false;
                    container.dataset.introStart = v.introStart || 0;
                    container.dataset.introEnd = v.introEnd || 0;
                    container.dataset.outroStart = v.outroStart || 0;
                    container.dataset.outroEnd = v.outroEnd || 0;
                    container.dataset.recapStart = v.recapStart || 0;
                    container.dataset.recapEnd = v.recapEnd || 0;
                    container.dataset.preferredAudioLanguage = v.preferredAudioLanguage || '';
                    container.dataset.defaultAudioTrackId = v.defaultAudioTrackId || '';
                    container.dataset.autoSkipIntro = 'false';
                    container.dataset.autoSkipRecap = 'false';
                    container.dataset.autoSkipOutro = 'false';
                    container.dataset.logoPath = `/api/video/logo/${v.id}`;
                    container.dataset.hlsForced = 'false';

                    // Update header
                    titleEl.textContent = v.title || v.seriesTitle || 'Video ' + videoId;
                    if (v.seriesTitle) {
                        metaEl.textContent = v.seriesTitle + (v.seasonNumber ? ` S${v.seasonNumber}E${v.episodeNumber}` : '');
                    } else if (v.releaseYear) {
                        metaEl.textContent = v.releaseYear;
                    }

                    // Show player and hide loading
                    container.style.display = '';
                    loadingMsg.style.display = 'none';

                    // Initialize SimplePlayer
                    if (window.ConversionGate) window.ConversionGate.init();
                    if (window.ConversionGate && window.ConversionGate.isBlocking()) return;

                    const tryInit = () => {
                        if (window.SimplePlayer) {
                            new window.SimplePlayer({
                                containerId: 'customPlayer',
                                videoId: 'videoElement',
                                currentVideoId: parseInt(videoId)
                            });
                        } else {
                            setTimeout(tryInit, 50);
                        }
                    };
                    tryInit();
                })
                .catch(err => {
                    loadingMsg.style.display = 'none';
                    errorMsg.style.display = 'block';
                    errorDetail.textContent = err.message || 'Unknown error';
                    titleEl.textContent = 'Error';
                });
        })();
    </script>
</body>
</html>
