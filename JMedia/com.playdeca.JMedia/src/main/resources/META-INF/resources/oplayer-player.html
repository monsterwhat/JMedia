<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMedia Player - OPlayer</title>
    <link rel="stylesheet" href="/css/player.css"/>
    <link rel="stylesheet" href="/css/subtitle-styling.css"/>
    <link rel="stylesheet" href="https://unpkg.com/@oplayer/ui@latest/dist/index.min.css"/>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .player-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        .player-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .back-btn {
            background: none;
            border: none;
            color: #48c774;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .back-btn:hover { background: rgba(72,199,116,0.15); }
        .media-info {
            flex: 1;
            min-width: 0;
        }
        .media-title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-meta {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
        }
        .oplayer-container {
            width: 100%;
            height: 100%;
        }
        .no-video-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #aaa;
            font-size: 18px;
        }
        .no-video-msg h2 { color: #48c774; margin-bottom: 8px; }
        /* OPlayer theme overrides to match JMedia green */
        .oplayer .op-controls {
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
        }
        .oplayer .op-progress-played {
            background: #48c774;
        }
        .oplayer .op-progress-hover {
            background: rgba(72,199,116,0.4);
        }
        .oplayer .op-volume-played {
            background: #48c774;
        }
        .oplayer .op-btn:hover {
            color: #48c774;
        }
        .oplayer .op-big-play {
            background: rgba(72,199,116,0.8);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="player-page">
        <div class="player-header">
            <button class="back-btn" onclick="window.history.back()" title="Back">←</button>
            <div class="media-info">
                <div class="media-title" id="mediaTitle">Loading...</div>
                <div class="media-meta" id="mediaMeta"></div>
            </div>
        </div>
        <div class="player-body">
            <div class="oplayer-container" id="oplayerContainer"></div>
            <div class="no-video-msg" id="noVideoMsg" style="display:none;">
                <h2>No video specified</h2>
                <p>Add ?videoId=XXX to the URL</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@oplayer/core@latest/dist/oplayer.min.js"></script>
    <script src="https://unpkg.com/@oplayer/ui@latest/dist/oplayer-ui.min.js"></script>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const videoId = params.get('videoId');
            const container = document.getElementById('oplayerContainer');
            const titleEl = document.getElementById('mediaTitle');
            const metaEl = document.getElementById('mediaMeta');
            const noVideoMsg = document.getElementById('noVideoMsg');

            if (!videoId) {
                noVideoMsg.style.display = 'block';
                container.style.display = 'none';
                return;
            }

            const streamUrl = `/api/video/stream/${videoId}.mp4`;

            // Fetch video metadata
            fetch(`/api/video/${videoId}`, { credentials: 'include' })
                .then(r => r.json())
                .then(data => {
                    const v = data.data || data;
                    if (v && v.title) titleEl.textContent = v.title;
                    if (v && v.seriesTitle) metaEl.textContent = v.seriesTitle + (v.seasonNumber ? ` S${v.seasonNumber}E${v.episodeNumber}` : '');
                    else if (v && v.releaseYear) metaEl.textContent = v.releaseYear;
                })
                .catch(() => { titleEl.textContent = 'Video ' + videoId; });

            const player = new OPlayer({
                source: { src: streamUrl, type: 'video/mp4' },
                plugins: [OUI({
                    // OPlayer UI plugin - controls are configured here
                })]
            }, container);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                const video = container.querySelector('video');
                if (!video) return;
                if (e.key === ' ' || e.key === 'k') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
                if (e.key === 'ArrowLeft') { video.currentTime = Math.max(0, video.currentTime - 10); }
                if (e.key === 'ArrowRight') { video.currentTime = Math.min(video.duration, video.currentTime + 10); }
                if (e.key === 'f') { document.fullscreenElement ? document.exitFullscreen() : container.requestFullscreen(); }
                if (e.key === 'm') { video.muted = !video.muted; }
            });
        })();
    </script>
</body>
</html>
