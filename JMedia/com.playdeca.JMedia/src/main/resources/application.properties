# Datasource - Settings (default persistence unit)
quarkus.datasource.db-kind=h2 
quarkus.datasource.jdbc.url=jdbc:h2:file:${user.home}/.jmedia/jmedia-settings;DB_CLOSE_DELAY=-1 
quarkus.datasource.username=sa
quarkus.datasource.password=

# Datasource - Music (persistence unit "music")
quarkus.datasource.music.db-kind=h2
quarkus.datasource.music.jdbc.url=jdbc:h2:file:${user.home}/.jmedia/jmedia-music;DB_CLOSE_DELAY=-1
quarkus.datasource.music.username=sa
quarkus.datasource.music.password=

# Datasource - Video (persistence unit "video")
quarkus.datasource.video.db-kind=h2
quarkus.datasource.video.jdbc.url=jdbc:h2:file:${user.home}/.jmedia/jmedia-video;DB_CLOSE_DELAY=-1
quarkus.datasource.video.username=sa
quarkus.datasource.video.password=
quarkus.log.category."org.h2".level=WARN
quarkus.log.category."API.Rest.XtreamCodesAPI".level=DEBUG
quarkus.log.file.enable=true
quarkus.log.file.path=${user.home}/.jmedia/jmedia.log
quarkus.log.file.level=DEBUG
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=3
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2}.%M] %s%e%n

# For HTTP - Running behind reverse proxy
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.idle-timeout=30m
quarkus.http.enable-compression=true

# Allow HTTP (TLS may be terminated by reverse proxy)
quarkus.http.insecure-requests=enabled

# Reverse Proxy Configuration - IMPORTANT for WebSocket and URL generation
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

# CORS Configuration
quarkus.http.cors.origins=http://localhost:8080,http://127.0.0.1:8080,http://192.168.100.99:8080,https://music.playdeca.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-JMedia-Sync-Key,X-User-ID,HX-Request,HX-Boosted,HX-Trigger,HX-Trigger-Name,HX-Target,HX-Current-URL,HX-Prompt
   
# Hibernate ORM
# Default persistence unit = settings
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# Entity package mapping per persistence unit (auto-includes subpackages)
quarkus.hibernate-orm.packages=Models.Settings
quarkus.hibernate-orm.music.packages=Models.Music
quarkus.hibernate-orm.video.packages=Models.Video

# Persistence unit "music" -> music datasource
quarkus.hibernate-orm.music.datasource=music
quarkus.hibernate-orm.music.schema-management.strategy=update
quarkus.hibernate-orm.music.log.sql=false

# Persistence unit "video" -> video datasource
quarkus.hibernate-orm.video.datasource=video
quarkus.hibernate-orm.video.schema-management.strategy=update
quarkus.hibernate-orm.video.log.sql=false

# Transaction Management
quarkus.transaction-manager.default-transaction-timeout=300

# Native image configuration
quarkus.native.additional-build-args=\
    --initialize-at-run-time=org.h2.server.TcpServer,\
    --initialize-at-run-time=org.h2.server.web.WebServer,\
    --install-exit-handlers

# Include all charsets (required for audio metadata libraries like jaudiotagger)
quarkus.native.add-all-charsets=true

# Authentication and Session Configuration
quarkus.http.auth.form.enabled=false
# quarkus.http.auth.form.cookie-name=JMEDIA_SESSION
# quarkus.http.auth.form.login-page=/login.html

# Local-network CIDR ranges that receive a non-Secure session cookie (for LAN access without TLS).
# The reverse proxy is expected to strip/replace X-Forwarded-For; IpResolutionUtils only trusts that header from 127.0.0.1.
# Override via jmedia.local-network-cidrs (comma-separated, supports CIDR or exact IPs).
# Defaults match the original hardcoded ranges for backwards compatibility.
jmedia.local-network-cidrs=192.168.100.0/24,10.50.0.0/24,127.0.0.1/32,::1/128
 
# Resource inclusion for native executable
# Note: META-INF/resources/ is auto-included by Quarkus
quarkus.native.resources.includes=WEB-INF/pages/*.html,**/*.html,scripts/**

# Sync schedule (cron expression)
sync.schedule=0 0 3 * * ?

# Metadata enrichment worker (fills missing imdbId, tmdbId, showImdbId, intro/outro/recap)
metadata.enrichment.interval=60s
metadata.enrichment.batch.size=3
metadata.enrichment.retry.cooldown.minutes=30

# Enable AWT for folder picker
java.awt.headless=false

# --- NATIVE HTTPS CONFIGURATION (DISABLED) ---
# quarkus.http.ssl.certificate.key-store-file=keystore.p12
# quarkus.http.ssl.certificate.key-store-password=jmedia_secure
# quarkus.http.ssl-port=8443

# WebSocket: run handler methods on worker threads (required for JTA)
quarkus.websocket.dispatch-to-worker=true

# Cache configuration for carousel endpoints (30s TTL)
quarkus.cache.caffeine.cinema-home-cache.initial-capacity=4
quarkus.cache.caffeine.cinema-home-cache.maximum-size=10
quarkus.cache.caffeine.cinema-home-cache.expire-after-write=30s
quarkus.cache.caffeine.optimized-carousels-cache.initial-capacity=4
quarkus.cache.caffeine.optimized-carousels-cache.maximum-size=10
quarkus.cache.caffeine.optimized-carousels-cache.expire-after-write=30s
