name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish uber jar to GitHub Releases
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JMedia/com.playdeca.JMedia

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve version from pom
        id: version
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Tag push $GITHUB_REF -> releasing"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released -> skipping"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is unreleased -> releasing"
          fi

      - name: Verify tag matches pom version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v${{ steps.version.outputs.version }}"
          actual="${GITHUB_REF#refs/tags/}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Tag $actual does not match pom version $expected. Fix the tag or the pom."
            exit 1
          fi

      - name: Create missing tag
        if: steps.decide.outputs.release == 'true' && !startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Package uber jar
        if: steps.decide.outputs.release == 'true'
        run: mvn -B -ntp package -DskipTests

      - name: Stage release artifact
        if: steps.decide.outputs.release == 'true'
        run: cp target/JMedia-runner.jar JMedia-runner.jar

      - name: Publish GitHub Release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: JMedia v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: JMedia/com.playdeca.JMedia/JMedia-runner.jar
