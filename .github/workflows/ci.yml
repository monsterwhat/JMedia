name: Build

on:
  push:
    branches: [main]
    paths:
      - 'JMedia/com.playdeca.JMedia/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'JMedia/com.playdeca.JMedia/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'

jobs:
  build:
    name: Build uber jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JMedia/com.playdeca.JMedia

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check documentation
        working-directory: .
        run: bash scripts/check-docs.sh

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Upload runnable uber jar
        uses: actions/upload-artifact@v5
        with:
          name: JMedia-runner
          path: JMedia/com.playdeca.JMedia/target/JMedia-runner.jar
          if-no-files-found: error
          retention-days: 30

      # Starts the packaged jar against a throwaway user.home and checks that it
      # serves the login page and rejects anonymous API calls. Blocking: it has
      # passed on every build since it was added (1.47.4, 1.47.5, 1.47.6, 1.47.7).
      - name: Smoke test the uber jar
        working-directory: .
        timeout-minutes: 5
        run: bash JMedia/scripts/smoke-jar.sh JMedia/com.playdeca.JMedia/target/JMedia-runner.jar

  integration:
    name: Integration (packaged runtime)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download the packaged jar
        uses: actions/download-artifact@v5
        with:
          name: JMedia-runner
          path: target

      - name: Tool versions
        run: |
          java -version
          ffmpeg -version | head -1

      - name: 3.2 fresh bootstrap and forced password change
        working-directory: .
        timeout-minutes: 6
        env:
          JAR: target/JMedia-runner.jar
        run: bash JMedia/scripts/it/it-bootstrap.sh

      - name: 3.3 migration from the previous release
        working-directory: .
        timeout-minutes: 10
        env:
          JAR: target/JMedia-runner.jar
          PREVIOUS_VERSION: 1.46.4
        run: |
          curl -fsSL -o /tmp/previous.jar \
            "https://github.com/monsterwhat/JMedia/releases/download/v${PREVIOUS_VERSION}/JMedia-runner.jar"
          OLD_JAR=/tmp/previous.jar bash JMedia/scripts/it/it-migration.sh

      - name: 3.5 sync authentication matrix
        working-directory: .
        timeout-minutes: 6
        env:
          JAR: target/JMedia-runner.jar
        run: bash JMedia/scripts/it/it-sync.sh

      - name: 3.4 HLS session lifecycle
        working-directory: .
        timeout-minutes: 10
        env:
          JAR: target/JMedia-runner.jar
        run: bash JMedia/scripts/it/it-hls.sh