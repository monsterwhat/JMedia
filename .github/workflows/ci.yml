name: Build

on:
  push:
    branches: [main]
    paths:
      - 'JMedia/com.playdeca.JMedia/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'JMedia/com.playdeca.JMedia/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'

jobs:
  build:
    name: Build uber jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JMedia/com.playdeca.JMedia

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check documentation
        working-directory: .
        run: bash scripts/check-docs.sh

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Upload runnable uber jar
        uses: actions/upload-artifact@v5
        with:
          name: JMedia-runner
          path: JMedia/com.playdeca.JMedia/target/JMedia-runner.jar
          if-no-files-found: error
          retention-days: 30

      # Starts the packaged jar against a throwaway user.home and checks that it
      # serves the login page and rejects anonymous API calls. Non-blocking while
      # it bakes: make it blocking once it has passed a few consecutive runs.
      - name: Smoke test the uber jar
        working-directory: .
        continue-on-error: true
        timeout-minutes: 5
        run: bash JMedia/scripts/smoke-jar.sh JMedia/com.playdeca.JMedia/target/JMedia-runner.jar