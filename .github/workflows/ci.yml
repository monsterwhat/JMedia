name: Build

on:
  push:
    branches: [main]
    paths:
      - 'JMedia/com.playdeca.JMedia/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'JMedia/com.playdeca.JMedia/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'

jobs:
  build:
    name: Build uber jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JMedia/com.playdeca.JMedia

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Upload runnable uber jar
        uses: actions/upload-artifact@v5
        with:
          name: JMedia-runner
          path: JMedia/com.playdeca.JMedia/target/JMedia-runner.jar
          if-no-files-found: error
          retention-days: 30